name: Deploy

# Build the Astro site and deploy to Cloudflare Workers on push to the default
# branch. Requires a CLOUDFLARE_API_TOKEN repository secret. The guard step keeps
# the run green while the secret is missing, so this workflow can be committed first.
#
# The build regenerates the toponym data with `npm run data` (its source,
# data/toponims/toponims.json, is versioned) and then runs `astro build`. It does
# not run the full `prebuild` (which also rebuilds the hero from an unversioned
# raw scan); the built hero image is versioned instead.

on:
  # Push-triggered auto-deploy is intentionally DISABLED for this Astro map.
  # The deep-zoom map tiles (web/public/map) are generated from a large raw scan
  # that is not versioned, so a clean CI checkout cannot reproduce the full site
  # and would deploy a version missing the map. Deploy manually from a complete
  # local checkout: `npm run deploy` (astro build + wrangler deploy). This
  # workflow is kept for manual runs only.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare token
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set yet — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          # Wrangler v4 requires Node >= 22; the deploy step reuses this runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        if: steps.guard.outputs.skip != 'true'
        working-directory: web
        run: |
          npm ci
          npm run data
          npx astro build
      - name: Deploy to Cloudflare Workers
        if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.112.0"
          workingDirectory: web
