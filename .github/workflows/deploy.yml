name: Deploy

# Build the Astro site and deploy to Cloudflare Workers on push to the default
# branch. Requires a CLOUDFLARE_API_TOKEN repository secret. The guard step keeps
# the run green while the secret is missing, so this workflow can be committed first.
#
# The build regenerates the toponym data with `npm run data` (its source,
# data/toponims/toponims.json, is versioned) and then runs `astro build`. It does
# not run the full `prebuild` (which also rebuilds the hero from an unversioned
# raw scan); the built hero image is versioned instead.

on:
  # Auto-deploy is safe here: the generated deploy assets (web/public/map and
  # web/public/hero) are versioned, so a clean CI checkout reproduces the full
  # site. `npm run data` regenerates the toponym JSON from its versioned source.
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare token
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set yet — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.skip != 'true'
        with:
          # Wrangler v4 requires Node >= 22; the deploy step reuses this runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        if: steps.guard.outputs.skip != 'true'
        working-directory: web
        run: |
          npm ci
          npm run data
          npx astro build
      - name: Check the site against its own security policy
        if: steps.guard.outputs.skip != 'true'
        # Fails the deploy if a page loads or runs anything the site's _headers does
        # not admit, or links to a page or anchor that does not exist.
        run: python3 scripts/check_site.py web/dist
      - name: Deploy to Cloudflare Workers
        if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Keep in sync with the wrangler devDependency in web/package.json.
          wranglerVersion: "4.118.0"
          workingDirectory: web
